<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard dashboard</title>
<style>
@font-face { font-family: "Instrument Serif"; src: url(/fonts/instrument-serif/files/instrument-serif-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url(/fonts/instrument-serif/files/instrument-serif-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 400; src: url(/fonts/inter/files/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 600; src: url(/fonts/inter/files/inter-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 800; src: url(/fonts/inter/files/inter-latin-800-normal.woff2) format("woff2"); }
:root {
  --bg: #F6F1E7; --paper: #FFFDF8; --ink: #1D1B1A; --muted: #7A736B; --line: #E6DFD2;
  --pink: #F59CC5; --pink-soft: #FBE3EE; --cream: #F2E6A8; --green: #2F8F5B; --green-soft: #E2F2E8;
  --amber: #B7791F; --amber-soft: #FBF0D5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; padding-bottom: 110px; }
header { position: sticky; top: 0; z-index: 20; background: rgba(246,241,231,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1080px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bar h1 { font: 400 28px/1 "Instrument Serif", Georgia, serif; margin: 0; }
.bar select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); max-width: 46vw; }
.chip { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--ink); color: #fff; white-space: nowrap; }
.tabs { margin-left: auto; display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; font: 600 13px Inter, sans-serif; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--ink); color: #fff; }
main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 0; }
.label { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
section { margin-top: 28px; }
section > .label { margin-bottom: 10px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }

/* pacing timeline */
.tl { display: grid; grid-template-columns: 96px 1fr; row-gap: 7px; align-items: center; }
.tl .name { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tl .track { position: relative; height: 18px; background: #F3EEE3; border-radius: 5px; overflow: hidden; }
.tl .track.beats { height: 30px; cursor: pointer; }
.tl .track.time { background: none; height: 14px; overflow: visible; }
.tl .tick { position: absolute; top: 0; font-size: 10px; color: var(--muted); transform: translateX(-50%); }
.tl .blk { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.tl .beats .blk { border: 1px solid var(--paper); background: #E9E2D3; font-size: 10px; font-weight: 600; padding: 6px 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tl .beats .blk.approved { background: var(--green-soft); color: #1E5E3B; }
.tl .beats .blk.changes { background: var(--amber-soft); color: #7A4F0E; }
.tl .beats .blk:hover { filter: brightness(.96); }
.tl .titles .blk { background: var(--pink); }
.tl .zoom .blk { background: var(--ink); }
.tl .caps .blk { background: #CFC6B4; }
.tl .cut { position: absolute; top: 0; bottom: 0; width: 2px; background: #D0463B; }
.tl .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); pointer-events: none; }
.legend { margin-top: 12px; font-size: 12px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* draft player */
.watch { display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: 22px; align-items: start; }
.watch video { width: 100%; border-radius: 18px; background: #000; display: block; aspect-ratio: 9/16; }
.watch h2 { font: 400 34px/1.1 "Instrument Serif", Georgia, serif; margin: 0 0 6px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.stat { background: #F3EEE3; border-radius: 12px; padding: 10px 14px; min-width: 92px; }
.stat b { display: block; font: 400 28px/1 "Instrument Serif", serif; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 600; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty h2 { font: 400 34px "Instrument Serif", serif; color: var(--ink); margin: 0 0 8px; }
code { background: #EFE8DA; padding: 2px 6px; border-radius: 5px; font-size: 13px; }

/* beat cards */
.beat { display: grid; grid-template-columns: 150px 1fr; gap: 20px; margin-top: 14px; scroll-margin-top: 80px; }
.beat.approved { border-color: #BFE0CC; }
.beat.changes { border-color: #EBD49B; }
.thumb { width: 150px; aspect-ratio: 9/16; border-radius: 16px; background: #1d1b1a center/cover; border: 4px solid var(--ink); cursor: pointer; position: relative; }
.thumb::after { content: "▶"; position: absolute; right: 8px; bottom: 6px; color: #fff; font-size: 12px; opacity: .8; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
.status { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: #EFE8DA; color: var(--muted); white-space: nowrap; }
.status.approved { background: var(--green-soft); color: #1E5E3B; }
.status.changes { background: var(--amber-soft); color: #7A4F0E; }
.beat h3 { font: 400 30px/1.1 "Instrument Serif", Georgia, serif; margin: 2px 0 10px; }
.rows { display: grid; grid-template-columns: 124px 1fr; gap: 6px 14px; font-size: 14px; }
.rows .label { padding-top: 3px; font-size: 10px; }
.rows ul { margin: 0; padding-left: 18px; }
.rows .said { font-style: italic; }
.rows .note { background: var(--amber-soft); border-radius: 8px; padding: 4px 8px; }
.rows .changed { background: var(--pink-soft); border-radius: 8px; padding: 4px 8px; }
.req { margin-top: 14px; }
textarea { width: 100%; min-height: 62px; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #F7F3EA; font: inherit; resize: vertical; }
textarea:focus { outline: 2px solid var(--pink); border-color: transparent; background: #fff; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
button.btn { font: 600 14px Inter, sans-serif; padding: 9px 16px; border-radius: 9px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--ink); }
button.btn.done { background: var(--green); border-color: var(--green); }
button.btn.sent { background: var(--amber); border-color: var(--amber); }
button.btn:disabled { opacity: .45; cursor: default; }

/* send bar + toast */
.send { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--ink); color: #fff; }
.send .in { max-width: 1080px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.send .count { font-size: 14px; flex: 1; min-width: 200px; }
.send .count b { color: var(--cream); }
.send button { font: 800 14px Inter, sans-serif; padding: 12px 20px; border-radius: 999px; border: 0; background: var(--pink); color: var(--ink); cursor: pointer; }
.send button.alt { background: var(--cream); }
.send button:disabled { opacity: .5; cursor: default; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; transition: .25s; z-index: 40; pointer-events: none; border: 1px solid #444; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* brand sheet */
.sw { display: flex; gap: 12px; flex-wrap: wrap; }
.sw div { width: 110px; }
.sw i { display: block; height: 70px; border-radius: 12px; border: 1px solid var(--line); }
.sw b { display: block; font-size: 13px; margin-top: 6px; }
.sw span { font-size: 12px; color: var(--muted); }
.fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.fonts div { background: #F3EEE3; border-radius: 12px; padding: 14px; }
.fonts p { margin: 4px 0 0; font-size: 30px; line-height: 1.1; }
.capdemo { background: #6b5f58; border-radius: 14px; padding: 34px 16px; text-align: center; color: #fff; }
.rules { margin: 0; padding-left: 20px; }
.rules li { margin: 5px 0; }

@media (max-width: 720px) {
  .watch { grid-template-columns: 1fr; }
  .watch video { max-width: 280px; margin: 0 auto; }
  .beat { grid-template-columns: 1fr; }
  .thumb { width: 120px; }
  .rows { grid-template-columns: 1fr; gap: 2px; }
  .rows .label { margin-top: 8px; }
  .tl { grid-template-columns: 62px 1fr; }
  .tabs { margin-left: 0; }
}
</style>
</head>
<body>
<header><div class="bar">
  <h1>Storyboard dashboard</h1>
  <select id="project" aria-label="Project"></select>
  <span class="chip" id="draftChip" hidden></span>
  <div class="tabs"><button id="tabStory" class="on">Storyboard</button><button id="tabBrand">Brand sheet</button></div>
</div></header>
<main id="main"></main>
<div class="send" id="send" hidden><div class="in"><div class="count" id="count"></div><button id="sendBtn"></button></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};
let S = null, view = 'story', project = new URLSearchParams(location.search).get('project') || '';
const drafts = {}; // unsaved textarea text per beat

const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3200); };
const api = async (path, data) => {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ project: S.project, ...data }) });
  const j = await r.json();
  if (!r.ok) { toast(j.error || 'Something went wrong'); throw new Error(j.error); }
  return j;
};
const load = async () => { S = await (await fetch('/api/state?project=' + encodeURIComponent(project))).json(); project = S.project || ''; };
const pct = (t) => (100 * t / S.total).toFixed(3) + '%';
const seek = (t) => { const v = $('#draft'); if (v) { v.currentTime = t + 0.02; v.play().catch(() => {}); v.scrollIntoView({ behavior: 'smooth', block: 'center' }); } };

function timeline() {
  const blk = (cls) => (x) => el('div', { class: 'blk ' + (cls || ''), style: `left:${pct(x.start)};width:${pct(x.end - x.start)}` });
  const step = S.total > 90 ? 15 : S.total > 40 ? 10 : 5;
  const ticks = []; for (let t = 0; t <= S.total; t += step) ticks.push(el('span', { class: 'tick', style: `left:${pct(t)}` }, `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`));
  const row = (name, cls, kids) => [el('div', { class: 'name' }, name), el('div', { class: 'track ' + cls }, kids)];
  return el('div', { class: 'panel' },
    el('div', { class: 'tl' },
      row('Time', 'time', ticks),
      row('Beats', 'beats', [...S.beats.map((b) => el('div', { class: 'blk ' + b.status, title: `${b.label} · ${b.range}`, style: `left:${pct(b.start)};width:${pct(b.end - b.start)}`, onclick: () => document.getElementById('beat-' + b.id).scrollIntoView({ behavior: 'smooth' }) }, b.label)), el('div', { class: 'head', id: 'head' })]),
      row('Titles & cards', 'titles', S.timeline.titles.map(blk())),
      row('Zoom', 'zoom', S.timeline.zoom.map(blk())),
      row('Your cuts', 'cuts', S.timeline.cuts.map((t) => el('div', { class: 'cut', style: `left:${pct(t)}` }))),
      row('Captions', 'caps', S.timeline.captions.map(blk())),
    ),
    el('div', { class: 'legend' },
      el('span', {}, el('i', { style: 'background:var(--pink)' }), 'Title or graphic card'),
      el('span', {}, el('i', { style: 'background:var(--ink)' }), 'Punch-in zoom'),
      el('span', {}, el('i', { style: 'background:#D0463B' }), 'Cut'),
      el('span', {}, el('i', { style: 'background:#CFC6B4' }), 'Caption on screen'),
      el('span', {}, el('i', { style: 'background:var(--green-soft);border:1px solid #BFE0CC' }), 'Approved'),
      el('span', {}, el('i', { style: 'background:var(--amber-soft);border:1px solid #EBD49B' }), 'Change requested'),
    ));
}

function beatCard(b) {
  const locked = !!S.submittedAt;
  const ta = el('textarea', { placeholder: 'e.g. Hold the checklist longer, or make the header say ...', 'aria-label': 'Change request for ' + b.label, disabled: locked });
  ta.value = drafts[b.id] ?? b.note;
  ta.addEventListener('input', () => (drafts[b.id] = ta.value));
  const set = async (status) => {
    if (status === 'changes' && !ta.value.trim()) { ta.focus(); return toast('Write what to change first'); }
    await api('/api/beat', { id: b.id, status, note: status === 'changes' ? ta.value.trim() : '' });
    delete drafts[b.id];
    toast(status === 'approved' ? 'Beat approved' : status === 'changes' ? 'Change request saved' : 'Cleared');
    await refresh();
  };
  const row = (name, node, cls) => node && [el('div', { class: 'label' }, name), el('div', { class: cls || '' }, node)];
  return el('div', { class: 'panel beat ' + b.status, id: 'beat-' + b.id },
    el('div', { class: 'thumb', style: b.thumb ? `background-image:url(${b.thumb})` : '', title: 'Play this beat', onclick: () => seek(b.start) }),
    el('div', {},
      el('div', { class: 'meta' }, el('span', {}, `Beat ${b.n} of ${b.of} · ${b.range}`), el('span', { class: 'status ' + b.status }, b.status === 'approved' ? 'Approved' : b.status === 'changes' ? 'Change requested' : 'Not reviewed')),
      el('h3', {}, b.label),
      el('div', { class: 'rows' },
        row('Your last note', b.lastNote, 'note'),
        row('What changed', b.whatChanged, 'changed'),
        row('You say', b.youSay && `“${b.youSay}”`, 'said'),
        row('On-screen text', b.onScreen.length ? el('ul', {}, b.onScreen.map((t) => el('li', {}, t))) : 'Captions only'),
        row('Visual', b.visual),
        row('Animation', b.animation),
        row('Zoom', b.zoom > 1 ? `Punch-in ${b.zoom}x for this beat` : 'None'),
        row('Sound', b.sfx.length ? b.sfx.join(', ') : null),
      ),
      el('div', { class: 'req' }, el('div', { class: 'label' }, 'Change request (optional)'), ta),
      el('div', { class: 'actions' },
        el('button', { class: 'btn ' + (b.status === 'approved' ? 'done' : ''), disabled: locked, onclick: () => set(b.status === 'approved' ? 'pending' : 'approved') }, b.status === 'approved' ? 'Approved ✓' : 'Approve beat'),
        el('button', { class: 'btn ' + (b.status === 'changes' ? 'sent' : 'ghost'), disabled: locked, onclick: () => set('changes') }, b.status === 'changes' ? 'Change saved ✓' : 'Request changes'),
      )));
}

function story() {
  if (!S.project) return el('div', { class: 'empty' }, el('h2', {}, 'No projects yet'), el('p', {}, 'Drop a rough cut into raw-footage/ and tell Claude: “add titles, captions and animations, and show me a storyboard before you export.”'));
  if (!S.rendered) return el('div', { class: 'empty' }, el('h2', {}, S.draft ? `Draft ${S.draft} is rendering` : 'Storyboard not drafted yet'), el('p', {}, 'This page updates on its own when the draft is ready.'));
  const a = S.beats.filter((b) => b.status === 'approved').length, c = S.beats.filter((b) => b.status === 'changes').length;
  const m = Math.floor(S.total / 60), s = Math.round(S.total % 60);
  return el('div', {},
    el('section', {}, el('div', { class: 'label' }, 'Pacing at a glance'), timeline()),
    el('section', {}, el('div', { class: 'label' }, 'Watch the full draft'),
      el('div', { class: 'panel watch' },
        el('video', { id: 'draft', src: S.video, controls: true, playsinline: true, preload: 'metadata' }),
        el('div', {},
          el('h2', {}, S.title),
          el('div', { style: 'color:var(--muted)' }, `Draft ${S.draft} · preview quality. The export is ${S.size}.`),
          el('div', { class: 'stats' },
            el('div', { class: 'stat' }, el('b', {}, `${m}:${String(s).padStart(2, '0')}`), el('span', {}, 'length')),
            el('div', { class: 'stat' }, el('b', {}, String(S.beats.length)), el('span', {}, 'beats')),
            el('div', { class: 'stat' }, el('b', {}, String(a)), el('span', {}, 'approved')),
            el('div', { class: 'stat' }, el('b', {}, String(c)), el('span', {}, 'change requests'))),
          el('p', {}, 'Approve each beat or leave a note on what to change, then send it back for the next draft. Tap a beat’s picture to play it.'),
          S.export && el('p', {}, el('b', {}, 'Exported: '), S.export.file.split(/[\\/]/).pop(), ' (in the exports folder)')))),
    el('section', {}, el('div', { class: 'label' }, 'Beats'), S.beats.map(beatCard)));
}

function brandSheet() {
  const b = S.brand || {};
  const fam = (k) => `"${(b.fonts || {})[k] || k}"`;
  const cap = b.captions || {};
  return el('div', {},
    el('section', {}, el('div', { class: 'panel' }, el('div', { class: 'label' }, 'Brand sheet'), el('h2', { style: 'font:400 40px/1.1 "Instrument Serif",serif;margin:6px 0' }, b.name || 'Your brand'), el('p', { style: 'margin:0;color:var(--muted)' }, b.summary || ''))),
    el('section', {}, el('div', { class: 'label' }, 'Colors'), el('div', { class: 'panel sw' }, Object.entries(b.colors || {}).map(([k, v]) => el('div', {}, el('i', { style: `background:${v}` }), el('b', {}, k), el('span', {}, v))))),
    el('section', {}, el('div', { class: 'label' }, 'Fonts'), el('div', { class: 'panel fonts' }, Object.entries(b.fonts || {}).map(([k, v]) => el('div', {}, el('span', { class: 'label' }, k), el('p', { style: `font-family:"${v}",serif` }, v))))),
    el('section', {}, el('div', { class: 'label' }, 'Captions'), el('div', { class: 'panel' },
      el('div', { class: 'capdemo', style: `font-family:${fam(cap.font)},serif;font-size:38px` }, 'this is how ', el('span', { style: `background:${cap.highlightColor || '#F7A9D6'};border-radius:6px;padding:0 8px` }, 'captions'), ' look'),
      el('p', { style: 'margin:12px 0 0;color:var(--muted)' }, `${cap.style === 'word' ? 'One word at a time' : `${cap.wordsPerPhrase || 4} words at a time`}, ${(b.fonts || {})[cap.font] || cap.font} ${cap.size}px, placed at y ${cap.y} on a 1080 x 1920 frame.`))),
    el('section', {}, el('div', { class: 'label' }, 'Pacing'), el('div', { class: 'panel' },
      el('div', { class: 'rows' }, Object.entries(b.pacing || {}).flatMap(([k, v]) => [el('div', { class: 'label' }, k.replace(/([A-Z])/g, ' $1')), el('div', {}, typeof v === 'object' ? Object.entries(v).map(([a, x]) => `${a.replace(/([A-Z])/g, ' $1').toLowerCase()} ${x}s`).join(' · ') : String(v))])))),
    el('section', {}, el('div', { class: 'label' }, 'Rules'), el('div', { class: 'panel' }, el('ul', { class: 'rules' }, (b.rules || []).map((r) => el('li', {}, r))))),
    el('section', {}, el('div', { class: 'label' }, 'Where this came from'), el('div', { class: 'panel' }, el('ul', { class: 'rules' }, (b.sources || []).map((r) => el('li', {}, r))))));
}

function render() {
  const keep = $('#draft') && !$('#draft').paused ? $('#draft').currentTime : null;
  const y = scrollY;
  const sel = $('#project');
  sel.replaceChildren(...(S.projects || []).map((p) => el('option', { value: p, selected: p === S.project }, p)));
  sel.hidden = (S.projects || []).length < 2;
  $('#draftChip').hidden = !S.draft; $('#draftChip').textContent = 'Draft ' + S.draft;
  $('#tabStory').classList.toggle('on', view === 'story'); $('#tabBrand').classList.toggle('on', view === 'brand');
  $('#main').replaceChildren(view === 'brand' ? brandSheet() : story());
  scrollTo(0, y);
  const v = $('#draft');
  if (v) {
    if (keep != null) { v.currentTime = keep; v.play().catch(() => {}); }
    v.addEventListener('timeupdate', () => { const h = $('#head'); if (h) h.style.left = pct(v.currentTime); });
  }
  // send bar
  const bar = $('#send'), btn = $('#sendBtn');
  bar.hidden = view !== 'story' || !S.rendered;
  if (bar.hidden) return;
  const a = S.beats.filter((b) => b.status === 'approved').length, c = S.beats.filter((b) => b.status === 'changes').length, p = S.beats.length - a - c;
  const count = $('#count');
  if (S.submittedAt) {
    count.replaceChildren(S.exportRequested ? 'Approved. Claude is exporting the final video…' : `Notes sent. Claude is making Draft ${S.draft + 1}…`);
    btn.textContent = 'Sent ✓'; btn.disabled = true; btn.className = '';
  } else {
    count.replaceChildren(el('b', {}, String(a)), ' approved · ', el('b', {}, String(c)), ` change request${c === 1 ? '' : 's'} · `, el('b', {}, String(p)), ' to review');
    const all = a === S.beats.length;
    btn.textContent = all ? 'Approve & export final' : 'Send notes to Claude';
    btn.className = all ? 'alt' : '';
    btn.disabled = !all && c === 0;
    btn.title = btn.disabled ? 'Approve every beat to export, or request a change to send notes' : '';
    btn.onclick = async () => {
      await api('/api/send', { export: all });
      toast(all ? 'Approved · Claude is exporting the final' : `Notes sent · Claude is making Draft ${S.draft + 1}`);
      await refresh();
    };
  }
}

const refresh = async () => { await load(); render(); };
$('#project').addEventListener('change', (e) => { project = e.target.value; history.replaceState(null, '', '?project=' + encodeURIComponent(project)); refresh(); });
$('#tabStory').onclick = () => { view = 'story'; render(); };
$('#tabBrand').onclick = () => { view = 'brand'; render(); };

// Watch for the next draft (or the export) and update without a manual reload.
setInterval(async () => {
  if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
  const before = S && [S.draft, S.rendered, S.renderedAt, S.submittedAt, S.export && S.export.exportedAt, S.project].join('|');
  const prevDraft = S && S.draft;
  try { await load(); } catch { return; }
  const after = [S.draft, S.rendered, S.renderedAt, S.submittedAt, S.export && S.export.exportedAt, S.project].join('|');
  if (before !== after) {
    render();
    if (S.rendered && S.draft !== prevDraft) toast(`Draft ${S.draft} is ready`);
    else if (S.export && !before.includes(S.export.exportedAt)) toast('Final video exported');
  }
}, 3000);

refresh();
</script>
</body>
</html>
